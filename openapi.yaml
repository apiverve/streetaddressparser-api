openapi: 3.0.4
info:
  title: Street Address Parser
  description: >-
    Street Address Parser is an address parsing API that breaks raw US street
    addresses into structured location components. Pass any single-line address
    string to extract the building number, directional, street name, street
    type, unit, city, state abbreviation, and postal code. Set standardize=true
    to get the address type (street, PO box or intersection) free, and on paid
    plans the mailing-format delivery line, last line and ZIP+4.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/streetaddressparser:
    get:
      summary: Street Address Parser
      description: >-
        Parse the components of a street address, and optionally return it
        standardized into mailing-label lines with standardize=true
      operationId: streetaddressparser
      parameters:
        - name: address
          in: query
          schema:
            type: string
          required: true
          description: The street address to parse
          example: 1600 Amphitheatre Parkway, Mountain View, CA 90210
        - name: standardize
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Add a standardized block: the address type, plus on paid plans the
            delivery line, last line and ZIP+4
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  address: 1600 Amphitheatre Parkway, Mountain View, CA 90210
                  parsed:
                    streetNumber: '1600'
                    streetType: Pkwy
                    streetAddress: Amphitheatre
                    cityName: Mountain View
                    stateName: CA
                    zipCode: '90210'
                  standardized:
                    addressType: street
                    deliveryLine1: 1600 Amphitheatre Pkwy
                    lastLine: Mountain View, CA 90210
                    zipPlus4: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
