[project]
name = "apiverve-streetaddressparser"
version = "1.2.5"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Street Address Parser is an address parsing API that breaks raw US street addresses into structured location components. Pass any single-line address string to extract the building number, directional, street name, street type, unit, city, state abbreviation, and postal code. Set standardize=true to get the address type (street, PO box or intersection) free, and on paid plans the mailing-format delivery line, last line and ZIP+4."
keywords = ["address parsing api", "street address parser api", "address parser", "address normalization api", "parse street address"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/streetaddressparser?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/streetaddressparser?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/streetaddressparser-api"
Twitter = "https://twitter.com/apivervehq"
